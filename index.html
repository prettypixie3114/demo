<!DOCTYPE html>
<html lang="en">

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #0a0e27;
            color: #f8fafc;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Utility classes */
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }

        .font-light { font-weight: 300; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }

        .tracking-tight { letter-spacing: -0.02em; }

        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mt-12 { margin-top: 3rem; }

        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }

        .ml-3 { margin-left: 0.75rem; }
        .ml-4 { margin-left: 1rem; }
        .ml-8 { margin-left: 2rem; }

        .mr-3 { margin-right: 0.75rem; }

        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }

        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }

        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }

        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }

        .space-y-2 > * + * { margin-top: 0.5rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .space-y-4 > * + * { margin-top: 1rem; }

        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }

        .grid { display: grid; }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

        .rounded { border-radius: 0.375rem; }
        .rounded-lg { border-radius: 0.5rem; }

        .border { border: 1px solid; }
        .border-b { border-bottom: 1px solid; }
        .border-t { border-top: 1px solid; }
        .border-l { border-left: 1px solid; }

        .overflow-hidden { overflow: hidden; }

        .hover\:opacity-90:hover { opacity: 0.9; }

        .transition-opacity { transition: opacity 0.3s ease; }
        .transition-all { transition: all 0.3s ease; }

        .cursor-pointer { cursor: pointer; }

        .w-full { width: 100%; }
        .min-h-screen { min-height: 100vh; }

        .max-w-7xl { max-width: 80rem; margin-left: auto; margin-right: auto; }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e27;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

                                impact: 'Limited daily budget restricts reach and conversion potential. 25% below recommended minimum.',
                                setup: 'Increase daily budget or consolidate with other ad sets to reach minimum threshold'

                                id: 'issue-4',
                                type: 'CPC Higher Than Expected',
                                severity: 'warning',
                                protocol: 'Target CPC: ₹25-30 for this audience',

                                setup: 'Refine audience targeting, test new creative assets, enable A/B testing'
                            }

                    }

                            {
                                id: 'issue-5',
                                type: 'Critical: ROAS Below Minimum',
                                severity: 'critical',
                                protocol: 'Minimum acceptable ROAS: 1.3x',
                                current: '1.06x',
                                expected: '≥ 1.3x',
                                impact: 'Campaign is underperforming. Only generating 81% of expected revenue. Immediate action needed.',
                                setup: 'Consider pausing and reallocating budget to better performing campaigns or completely restructure audience targeting'
                            },
                            {
                                id: 'issue-6',
                                type: 'CTR Below Industry Standard',
                                severity: 'warning',
                                protocol: 'Fashion industry average CTR: ≥ 1.2%',
                                current: '0.78%',
                                expected: '≥ 1.2%',
                                impact: 'Click-through rate is 35% below industry benchmark. Ad creative may need refresh.',
                                setup: 'Test new creative variations, update product imagery, improve ad copy messaging'

                        ]
                    }
                },

                    spend: 32110,
                    impressions: 43478,

                    roas: 1.075,

                    budget: 4000,
                    budgetType: 'Daily',
                    compliance: {
                        compliant: false,
                        score: 52,
                        issues: [
                            {
                                id: 'issue-7',
                                type: 'CPC Significantly High',
                                severity: 'critical',
                                protocol: 'Maximum acceptable CPC: ₹35 for bundle products',
                                current: '₹49.48',
                                expected: '≤ ₹35',
                                impact: 'Cost per click is 41% above target. Getting low-quality traffic. Profitability at risk.',
                                setup: 'Review audience demographics (age, location, interests), test interest-based vs. lookalike targeting, check conversion pixel accuracy'
                            }
                        ]
                    }
                }
            ];

            const expectedSetup = {
                audiences: {
                    ageRange: '25-54',
                    gender: 'Female/All',
                    locations: 'India',
                    interests: 'Fashion, Clothing, Lifestyle'
                },
                bidding: {
                    strategy: 'Highest volume (Conversion focused)',
                    optimization: 'Maximize conversions',
                    placement: 'Facebook, Instagram, Audience Network'
                },
                targeting: {
                    expansion: 'Yes',
                    lookalike: 'Based on purchasers',
                    exclusions: 'Past 180 days purchasers (for TOFU)'
                },
                performance: {
                    minROAS: 1.3,
                    targetROAS: 1.5,
                    maxCPC: 35,
                    targetCTR: 1.2
                }
            };

            const overallMetrics = {
                totalSpend: 1820656,
                totalImpressions: 9890445,
                totalPurchases: 456,
                totalROAS: 1.32,
                avgCPC: 22.84,
                totalReach: 4348349,
                compliantCampaigns: 1,
                totalCampaigns: 5
            };

            const complianceStatus = [
                { id: 'p1', name: 'Target ROAS', requirement: '≥ 1.3x', status: 'partial', campaigns: '2/5 compliant' },
                { id: 'p2', name: 'Minimum Daily Budget', requirement: '≥ ₹2,000', status: 'failed', campaigns: '1/5 compliant' },
                { id: 'p3', name: 'CPC Target', requirement: '₹25-35 range', status: 'partial', campaigns: '3/5 compliant' },
                { id: 'p4', name: 'CTR Performance', requirement: '≥ 1.2%', status: 'partial', campaigns: '2/5 compliant' },
                { id: 'p5', name: 'Audience Setup', requirement: 'F25-54, India', status: 'passed', campaigns: '5/5 compliant' },
                { id: 'p6', name: 'Conversion Tracking', requirement: 'Active pixels', status: 'passed', campaigns: '5/5 compliant' }
            ];

            const toggleIssue = (issueId) => {
                setExpandedIssue(expandedIssue === issueId ? null : issueId);
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case 'passed': return '#10b981';
                    case 'failed': return '#ef4444';
                    case 'partial': return '#f59e0b';
                    default: return '#6b7280';
                }
            };

            const getStatusBg = (status) => {
                switch(status) {
                    case 'passed': return '#064e3b';
                    case 'failed': return '#7f1d1d';
                    case 'partial': return '#78350f';
                    default: return '#1f2937';
                }
            };

            const getComplianceColor = (score) => {
                if (score >= 85) return '#10b981';
                if (score >= 70) return '#f59e0b';
                return '#ef4444';
            };

            return (
                <div style={{ minHeight: '100vh', backgroundColor: '#0a0e27' }}>
                    {/* Header */}
                    <div style={{ borderBottom: '1px solid #1e293b', backgroundColor: '#0f172a' }}>
                        <div style={{ maxWidth: '80rem', margin: '0 auto', padding: '2rem' }}>
                            <div>
                                <h1 style={{ fontSize: '2.25rem', fontWeight: 300, letterSpacing: '-0.02em', color: '#f8fafc' }}>

                                    {(overallMetrics.totalReach / 1000000).toFixed(1)}M
                                </p>
                                <p style={{ fontSize: '0.75rem', marginTop: '0.25rem', color: '#94a3b8' }}>{overallMetrics.totalImpressions.toLocaleString()} impressions</p>

                                <p style={{ fontSize: '1.5rem', fontWeight: 700, marginTop: '0.5rem', color: '#f8fafc' }}>

                                </p>
                                <p style={{ fontSize: '0.75rem', marginTop: '0.25rem', color: '#94a3b8' }}>Target: ₹25-35</p>
                            </div>

                            <div style={{ padding: '1.5rem', borderRadius: '0.5rem', backgroundColor: '#1e293b', borderLeft: '4px solid #ec4899' }}>

                                            padding: '1rem',
                                            borderRadius: '0.5rem',
                                            backgroundColor: '#1e293b',
                                            borderColor: protocol.status === 'failed' ? '#ef4444' : protocol.status === 'partial' ? '#f59e0b' : '#10b981',

                                            </div>
                                        </div>

                                                                    alignItems: 'center',
                                                                    gap: '0.25rem',
                                                                    padding: '0.25rem 0.5rem',
                                                                    borderRadius: '0.375rem',
                                                                    fontSize: '0.75rem',
                                                                    fontWeight: 500,
                                                                    backgroundColor: '#064e3b',
                                                                    color: '#10b981'

                                                                    <CheckCircle2 size={14} /> Pass

                                                                <span style={{
                                                                    display: 'inline-flex',
                                                                    alignItems: 'center',
                                                                    gap: '0.25rem',
                                                                    padding: '0.25rem 0.5rem',
                                                                    borderRadius: '0.375rem',
                                                                    fontSize: '0.75rem',

                                                    </p>
                                                </div>
                                                <div style={{ textAlign: 'right', marginLeft: '2rem' }}>
                                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: '1.5rem', fontSize: '0.875rem' }}>
                                                        <div>
                                                            <p style={{ color: '#94a3b8', fontSize: '0.75rem' }}>ROAS</p>
                                                            <p style={{
                                                                fontWeight: 700,
                                                                color: campaign.roas >= 1.3 ? '#10b981' : '#f59e0b'
                                                            }}>
                                                                {campaign.roas.toFixed(2)}x
                                                            </p>
                                                        </div>
                                                        <div>
                                                            <p style={{ color: '#94a3b8', fontSize: '0.75rem' }}>CPC</p>
                                                            <p style={{
                                                                fontWeight: 700,
                                                                color: campaign.cpc <= 35 ? '#10b981' : '#ef4444'
                                                            }}>
                                                                ₹{campaign.cpc.toFixed(0)}
                                                            </p>
                                                        </div>
                                                        <div>
                                                            <p style={{ color: '#94a3b8', fontSize: '0.75rem' }}>CTR</p>
                                                            <p style={{
                                                                fontWeight: 700,
                                                                color: campaign.ctr >= 1.2 ? '#10b981' : '#f59e0b'
                                                            }}>
                                                                {campaign.ctr.toFixed(2)}%
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                                <ChevronDown
                                                    size={20}
                                                    style={{
                                                        color: '#94a3b8',
                                                        transform: selectedCampaign === campaign.id ? 'rotate(180deg)' : 'rotate(0deg)',
                                                        transition: 'transform 0.3s ease',
                                                        marginLeft: '1rem'
                                                    }}
                                                />
                                            </div>
                                        </div>

                                        {/* Expanded Details */}
                                        {selectedCampaign === campaign.id && (
                                            <div style={{ backgroundColor: '#0f172a', borderTop: '1px solid #334155', padding: '1.5rem' }}>
                                                {campaign.compliance.compliant ? (
                                                    <div style={{ textAlign: 'center', paddingTop: '2rem', paddingBottom: '2rem' }}>
                                                        <CheckCircle2 size={40} color="#10b981" style={{ margin: '0 auto', marginBottom: '0.75rem' }} />
                                                        <p style={{ color: '#94a3b8' }}>All setup requirements and performance targets are being met. Campaign is operating optimally.</p>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <p style={{ fontSize: '0.875rem', fontWeight: 500, marginBottom: '1rem', color: '#f8fafc' }}>Issues Found ({campaign.compliance.issues.length})</p>
                                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                                            {campaign.compliance.issues.map((issue) => (
                                                                <div
                                                                    key={issue.id}
                                                                    style={{
                                                                        borderRadius: '0.5rem',
                                                                        padding: '1rem',
                                                                        backgroundColor: '#1e293b',
                                                                        borderLeft: `4px solid ${issue.severity === 'critical' ? '#ef4444' : '#f59e0b'}`
                                                                    }}
                                                                >
                                                                    <button
                                                                        onClick={() => toggleIssue(issue.id)}
                                                                        style={{
                                                                            width: '100%',
                                                                            textAlign: 'left',
                                                                            display: 'flex',
                                                                            alignItems: 'flex-start',
                                                                            justifyContent: 'space-between',
                                                                            background: 'none',
                                                                            border: 'none',
                                                                            cursor: 'pointer',
                                                                            color: 'inherit',
                                                                            padding: 0
                                                                        }}
                                                                        onMouseOver={(e) => e.currentTarget.style.opacity = '0.9'}
                                                                        onMouseOut={(e) => e.currentTarget.style.opacity = '1'}
                                                                    >
                                                                        <div style={{ flex: 1 }}>
                                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem' }}>
                                                                                <AlertCircle size={16} color={issue.severity === 'critical' ? '#ef4444' : '#f59e0b'} />
                                                                                <h4 style={{ fontSize: '0.875rem', fontWeight: 500, color: '#f8fafc' }}>
                                                                                    {issue.type}
                                                                                </h4>
                                                                                <span style={{
                                                                                    fontSize: '0.75rem',
                                                                                    padding: '0.25rem 0.5rem',
                                                                                    borderRadius: '0.375rem',
                                                                                    fontWeight: 500,
                                                                                    backgroundColor: issue.severity === 'critical' ? '#ef444422' : '#f59e0b22',
                                                                                    color: issue.severity === 'critical' ? '#ef4444' : '#f59e0b'
                                                                                }}>
                                                                                    {issue.severity.toUpperCase()}
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                        <ChevronDown
                                                                            size={16}
                                                                            style={{
                                                                                color: '#94a3b8',
                                                                                transform: expandedIssue === issue.id ? 'rotate(180deg)' : 'rotate(0deg)',
                                                                                transition: 'transform 0.3s ease'
                                                                            }}
                                                                        />
                                                                    </button>

                                                                    {expandedIssue === issue.id && (
                                                                        <div style={{ marginTop: '1rem', paddingTop: '1rem', borderTop: '1px solid #334155' }}>
                                                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: '1rem', marginBottom: '1rem' }}>
                                                                                <div>
                                                                                    <p style={{ fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem', color: '#94a3b8' }}>CURRENTLY DELIVERED</p>
                                                                                    <p style={{ fontSize: '0.875rem', fontWeight: 500, color: '#ef4444' }}>{issue.current}</p>
                                                                                </div>
                                                                                <div>
                                                                                    <p style={{ fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem', color: '#94a3b8' }}>EXPECTED SETUP</p>
                                                                                    <p style={{ fontSize: '0.875rem', fontWeight: 500, color: '#10b981' }}>{issue.expected}</p>
                                                                                </div>
                                                                            </div>

                                                                            <div style={{ marginBottom: '1rem' }}>
                                                                                <p style={{ fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.5rem', color: '#94a3b8' }}>PROTOCOL REQUIREMENT</p>
                                                                                <p style={{ fontSize: '0.875rem', color: '#cbd5e1' }}>{issue.protocol}</p>
                                                                            </div>

                                                                            <div style={{ padding: '0.75rem', borderRadius: '0.375rem', backgroundColor: '#1e293b', borderLeft: '3px solid #f59e0b', marginBottom: '1rem' }}>
                                                                                <p style={{ fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.25rem', color: '#f59e0b' }}>BUSINESS IMPACT</p>
                                                                                <p style={{ fontSize: '0.875rem', color: '#cbd5e1' }}>{issue.impact}</p>
                                                                            </div>

                                                                            <div style={{ padding: '0.75rem', borderRadius: '0.375rem', backgroundColor: '#1e293b', borderLeft: '3px solid #3b82f6' }}>
                                                                                <p style={{ fontSize: '0.75rem', fontWeight: 500, marginBottom: '0.5rem', color: '#3b82f6' }}>✓ RECOMMENDED FIX &amp; SETUP CHANGE</p>
                                                                                <p style={{ fontSize: '0.875rem', color: '#cbd5e1' }}>{issue.setup}</p>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Summary Section */}
                        <div style={{ marginTop: '3rem', display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: '1.5rem' }}>
                            <div style={{ padding: '1.5rem', borderRadius: '0.5rem', backgroundColor: '#1e293b', borderTop: '3px solid #f59e0b' }}>
                                <h3 style={{ fontSize: '0.875rem', fontWeight: 500, marginBottom: '1rem', color: '#f8fafc' }}>📊 Compliance Summary</h3>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <p style={{ color: '#94a3b8' }}>Total Campaigns</p>
                                        <p style={{ fontWeight: 500, color: '#f8fafc' }}>3</p>
                                    </div>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <p style={{ color: '#94a3b8' }}>Compliant</p>
                                        <p style={{ fontWeight: 500, color: '#10b981' }}>1</p>
                                    </div>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <p style={{ color: '#94a3b8' }}>Non-Compliant</p>
                                        <p style={{ fontWeight: 500, color: '#ef4444' }}>2</p>
                                    </div>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <p style={{ color: '#94a3b8' }}>Critical Issues</p>
                                        <p style={{ fontWeight: 500, color: '#ef4444' }}>2</p>
                                    </div>
                                </div>
                            </div>

                            <div style={{ padding: '1.5rem', borderRadius: '0.5rem', backgroundColor: '#1e293b', borderTop: '3px solid #3b82f6' }}>
                                <h3 style={{ fontSize: '0.875rem', fontWeight: 500, marginBottom: '1rem', color: '#f8fafc' }}>⚡ Priority Actions</h3>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                    <button style={{
                                        width: '100%',
                                        padding: '0.625rem 1rem',
                                        borderRadius: '0.375rem',
                                        fontSize: '0.875rem',
                                        fontWeight: 500,
                                        backgroundColor: '#ef4444',
                                        color: '#f8fafc',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'opacity 0.3s ease'
                                    }}
                                    onMouseOver={(e) => e.currentTarget.style.opacity = '0.9'}
                                    onMouseOut={(e) => e.currentTarget.style.opacity = '1'}
                                    >
                                        ✓ Fix Non-Compliant Issues
                                    </button>
                                    <button style={{
                                        width: '100%',
                                        padding: '0.625rem 1rem',
                                        borderRadius: '0.375rem',
                                        fontSize: '0.875rem',
                                        fontWeight: 500,
                                        backgroundColor: '#3b82f6',
                                        color: '#f8fafc',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'opacity 0.3s ease'
                                    }}
                                    onMouseOver={(e) => e.currentTarget.style.opacity = '0.9'}
                                    onMouseOut={(e) => e.currentTarget.style.opacity = '1'}
                                    >
                                        📊 Download Compliance Report
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<FFTExecutiveDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
